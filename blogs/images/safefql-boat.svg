<?xml version="1.0" encoding="UTF-8"?>
<!-- SafeFQL — Safe Boat Navigation environment, replicating the topology
     of the custom benchmark (drifting river, two circular obstacles, goal).
     A faint trajectory shows what a safe rollout looks like under SafeFQL. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img"
     aria-label="Safe Boat Navigation: 2D river with state-dependent drift, two circular obstacles, start point S, goal G; SafeFQL trajectory in copper">
  <defs>
    <linearGradient id="riverBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#15130F"/>
      <stop offset="100%" stop-color="#0E0D0B"/>
    </linearGradient>
    <radialGradient id="obstacle" cx="50%" cy="40%" r="65%">
      <stop offset="0%"  stop-color="#D8553A"/>
      <stop offset="60%" stop-color="#B8541C"/>
      <stop offset="100%" stop-color="#6E2F0E"/>
    </radialGradient>
    <radialGradient id="goalDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#E9A766"/>
      <stop offset="100%" stop-color="#E8722C"/>
    </radialGradient>
    <linearGradient id="trajGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#E8722C" stop-opacity="0"/>
      <stop offset="35%" stop-color="#E8722C" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#E9A766"/>
    </linearGradient>
    <marker id="boatHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E9A766"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="url(#riverBg)"/>

  <!-- Coordinate frame: x ∈ [-3, 2], y ∈ [-2, 2]. Map to a 60-px-per-unit canvas
       centered around (160, 190) so x=0 → 220 in pixel space. -->
  <g transform="translate(40, 28)">
    <rect width="640" height="304" rx="6" fill="#0c0a07" stroke="#2E2820"/>
    <text x="14" y="22" fill="#7E7565" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.5">SAFE BOAT NAVIGATION · ENV</text>

    <!-- Faint grid (every 1 unit horizontally → every 80px in 5-unit-wide canvas) -->
    <g stroke="#1C1813" stroke-width="1">
      <line x1="0"   y1="76"  x2="640" y2="76"/>
      <line x1="0"   y1="152" x2="640" y2="152"/>
      <line x1="0"   y1="228" x2="640" y2="228"/>
      <line x1="128" y1="0"   x2="128" y2="304"/>
      <line x1="256" y1="0"   x2="256" y2="304"/>
      <line x1="384" y1="0"   x2="384" y2="304"/>
      <line x1="512" y1="0"   x2="512" y2="304"/>
    </g>

    <!-- River drift arrows: longitudinal velocity 2 - 0.5*y² (faster near centre line). -->
    <g fill="#7E7565" font-family="JetBrains Mono, monospace" font-size="9" stroke="#7E7565" stroke-width="1.1" stroke-linecap="round" opacity=".45">
      <!-- y rows: top to bottom corresponds to y = +2, +1, 0, -1, -2 -->
      <!-- Each arrow length scaled to drift magnitude (longest at y=0) -->
      <g>
        <line x1="40"  y1="32"  x2="58"  y2="32"/><polygon points="58,29 64,32 58,35" />
        <line x1="180" y1="32"  x2="198" y2="32"/><polygon points="198,29 204,32 198,35" />
        <line x1="320" y1="32"  x2="338" y2="32"/><polygon points="338,29 344,32 338,35" />
        <line x1="460" y1="32"  x2="478" y2="32"/><polygon points="478,29 484,32 478,35" />
        <line x1="560" y1="32"  x2="578" y2="32"/><polygon points="578,29 584,32 578,35" />
      </g>
      <g opacity=".7">
        <line x1="40"  y1="100" x2="76"  y2="100"/><polygon points="76,97 84,100 76,103" />
        <line x1="200" y1="100" x2="236" y2="100"/><polygon points="236,97 244,100 236,103" />
        <line x1="360" y1="100" x2="396" y2="100"/><polygon points="396,97 404,100 396,103" />
        <line x1="520" y1="100" x2="556" y2="100"/><polygon points="556,97 564,100 556,103" />
      </g>
      <g opacity="1">
        <line x1="40"  y1="156" x2="92"  y2="156"/><polygon points="92,153 100,156 92,159" />
        <line x1="220" y1="156" x2="272" y2="156"/><polygon points="272,153 280,156 272,159" />
        <line x1="400" y1="156" x2="452" y2="156"/><polygon points="452,153 460,156 452,159" />
        <line x1="540" y1="156" x2="592" y2="156"/><polygon points="592,153 600,156 592,159" />
      </g>
      <g opacity=".7">
        <line x1="40"  y1="212" x2="76"  y2="212"/><polygon points="76,209 84,212 76,215" />
        <line x1="200" y1="212" x2="236" y2="212"/><polygon points="236,209 244,212 236,215" />
        <line x1="360" y1="212" x2="396" y2="212"/><polygon points="396,209 404,212 396,215" />
        <line x1="520" y1="212" x2="556" y2="212"/><polygon points="556,209 564,212 556,215" />
      </g>
      <g opacity=".45">
        <line x1="40"  y1="272" x2="58"  y2="272"/><polygon points="58,269 64,272 58,275" />
        <line x1="180" y1="272" x2="198" y2="272"/><polygon points="198,269 204,272 198,275" />
        <line x1="320" y1="272" x2="338" y2="272"/><polygon points="338,269 344,272 338,275" />
        <line x1="460" y1="272" x2="478" y2="272"/><polygon points="478,269 484,272 478,275" />
        <line x1="560" y1="272" x2="578" y2="272"/><polygon points="578,269 584,272 578,275" />
      </g>
    </g>

    <!-- Obstacles. Map x ∈ [-3, 2] → pixel ∈ [0, 640], y ∈ [-2, 2] → [304, 0].
         Obstacle 1: centre (-0.5, 0.5), radius 0.4  → centre (320, 114), r ≈ 50 (using min(scale_x, scale_y) ≈ 76; we use 50 for tighter visual)
         Obstacle 2: centre (-1.0, -1.2), radius 0.5 → centre (256, 244), r ≈ 60 -->
    <g>
      <circle cx="320" cy="114" r="46" fill="url(#obstacle)" stroke="#E8722C" stroke-opacity=".7"/>
      <circle cx="320" cy="114" r="60" fill="none" stroke="#E8722C" stroke-opacity=".18" stroke-dasharray="3 4"/>
      <text x="320" y="118" text-anchor="middle" fill="#15130F" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">ℱ₁</text>

      <circle cx="256" cy="244" r="56" fill="url(#obstacle)" stroke="#E8722C" stroke-opacity=".7"/>
      <circle cx="256" cy="244" r="72" fill="none" stroke="#E8722C" stroke-opacity=".18" stroke-dasharray="3 4"/>
      <text x="256" y="248" text-anchor="middle" fill="#15130F" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">ℱ₂</text>
    </g>

    <!-- Start point S at (-2.5, -1.5) → pixel (64, 266). Goal G at (0.5, 0.0) → (448, 152). -->
    <g>
      <!-- SafeFQL trajectory (smooth curve threading between obstacles) -->
      <path d="M64,266 C 110,234 150,200 196,184 S 280,150 320,170 S 380,200 410,180 S 430,160 446,154"
            fill="none" stroke="url(#trajGrad)" stroke-width="3" stroke-linecap="round" marker-end="url(#boatHead)"/>
      <!-- Sample points along trajectory -->
      <g fill="#E9A766">
        <circle cx="110" cy="232" r="2.5"/>
        <circle cx="170" cy="200" r="2.5"/>
        <circle cx="230" cy="178" r="2.5"/>
        <circle cx="290" cy="172" r="2.5"/>
        <circle cx="360" cy="184" r="2.5"/>
        <circle cx="410" cy="172" r="2.5"/>
      </g>

      <!-- Start -->
      <circle cx="64" cy="266" r="9" fill="#15130F" stroke="#E8722C" stroke-width="2"/>
      <text x="64" y="270" text-anchor="middle" fill="#E8722C" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">S</text>

      <!-- Goal -->
      <circle cx="448" cy="152" r="11" fill="url(#goalDot)" stroke="#F2E9D8" stroke-width="1.5"/>
      <text x="448" y="156" text-anchor="middle" fill="#15130F" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">G</text>
    </g>

    <!-- Annotations -->
    <g font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.1">
      <text x="460" y="282" fill="#7E7565">ℓ(x) &lt; 0  →  SAFE</text>
      <text x="460" y="296" fill="#E8722C">ℓ(x) ≥ 0  →  ℱ</text>
    </g>
  </g>

  <!-- Caption strip below the rect -->
  <text x="40" y="356" fill="#B7AC97" font-family="Inter, sans-serif" font-size="13">2D point-mass boat · drift v(x) = 2 − 0.5·y² along the x-axis · two circular failure regions ℱ₁, ℱ₂.</text>
</svg>
