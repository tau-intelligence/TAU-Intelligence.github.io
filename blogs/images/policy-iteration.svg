<?xml version="1.0" encoding="UTF-8"?>
<!-- Tau Intelligence — example diagram for the welcome blog post.
     A stylised "policy iteration on a gridworld" visual that doubles as
     a placeholder for any blog figure. Replace freely. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Policy iteration on a gridworld">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#15130F"/>
      <stop offset="100%" stop-color="#0E0D0B"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#E8722C" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#B8541C" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="goal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#E9A766"/>
      <stop offset="100%" stop-color="#E8722C"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>

  <!-- 6x4 grid -->
  <g transform="translate(40,40)" stroke="#2E2820" stroke-width="1.2">
    <g fill="#1C1813">
      <!-- 24 cells, 80px wide, 56px tall -->
      <rect x="0"   y="0"   width="80" height="56"/>
      <rect x="80"  y="0"   width="80" height="56"/>
      <rect x="160" y="0"   width="80" height="56"/>
      <rect x="240" y="0"   width="80" height="56"/>
      <rect x="320" y="0"   width="80" height="56"/>
      <rect x="400" y="0"   width="80" height="56" fill="url(#goal)"/>
      <rect x="0"   y="56"  width="80" height="56"/>
      <rect x="80"  y="56"  width="80" height="56" fill="#25201A"/>
      <rect x="160" y="56"  width="80" height="56"/>
      <rect x="240" y="56"  width="80" height="56" fill="#25201A"/>
      <rect x="320" y="56"  width="80" height="56"/>
      <rect x="400" y="56"  width="80" height="56"/>
      <rect x="0"   y="112" width="80" height="56"/>
      <rect x="80"  y="112" width="80" height="56"/>
      <rect x="160" y="112" width="80" height="56" fill="#25201A"/>
      <rect x="240" y="112" width="80" height="56"/>
      <rect x="320" y="112" width="80" height="56"/>
      <rect x="400" y="112" width="80" height="56"/>
      <rect x="0"   y="168" width="80" height="56" fill="url(#cell)"/>
      <rect x="80"  y="168" width="80" height="56"/>
      <rect x="160" y="168" width="80" height="56"/>
      <rect x="240" y="168" width="80" height="56"/>
      <rect x="320" y="168" width="80" height="56"/>
      <rect x="400" y="168" width="80" height="56"/>
    </g>

    <!-- Optimal-policy arrows (greedy w.r.t. learnt value) -->
    <g stroke="#E9A766" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arr)">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#E9A766"/>
        </marker>
      </defs>
      <line x1="40"  y1="196" x2="40"  y2="148"/>
      <line x1="40"  y1="140" x2="40"  y2="92"/>
      <line x1="40"  y1="84"  x2="40"  y2="36"/>
      <line x1="48"  y1="28"  x2="80"  y2="28"/>
      <line x1="160" y1="28"  x2="200" y2="28"/>
      <line x1="240" y1="28"  x2="280" y2="28"/>
      <line x1="320" y1="28"  x2="360" y2="28"/>
      <line x1="400" y1="28"  x2="440" y2="28"/>
    </g>

    <!-- Start / Goal labels -->
    <text x="40"  y="200" text-anchor="middle" fill="#0E0D0B" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">S</text>
    <text x="440" y="32"  text-anchor="middle" fill="#0E0D0B" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">G</text>
  </g>

  <!-- Title -->
  <text x="40" y="280" fill="#F2E9D8" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-style="italic">Policy iteration on a 6×4 gridworld</text>
  <text x="40" y="302" fill="#7E7565" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.2">CONVERGED IN 7 SWEEPS · γ = 0.95</text>
</svg>
