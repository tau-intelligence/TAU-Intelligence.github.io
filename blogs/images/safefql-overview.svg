<?xml version="1.0" encoding="UTF-8"?>
<!--
  SafeFQL framework overview, modelled after Figure 1 of the paper
  (Tayal, Tayal and Prakash, 2026) but recoloured to the Tau
  Intelligence palette: a warm-gold band for the Flow Matching teacher,
  a cool-teal band for the Feasibility-Gated actor, and a copper band
  for Conformal Prediction. The central highlighted "Safe and Optimal
  One-Step Policy" tile spans the gold and teal bands, mirroring the
  paper's layout.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760"
     role="img" aria-label="SafeFQL framework: a flow-matching teacher distilled into a one-step actor, gated by reward and safety critics, then verified with conformal calibration before deployment.">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#15130F"/>
      <stop offset="100%" stop-color="#0E0D0B"/>
    </linearGradient>

    <!-- band tints -->
    <linearGradient id="bandGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#E9A766" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#B8541C" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="bandCool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#6FB7C9" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#3F7E8F" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="bandCopper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#E8722C" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#B8541C" stop-opacity=".06"/>
    </linearGradient>

    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1C1813"/>
      <stop offset="100%" stop-color="#15130F"/>
    </linearGradient>
    <linearGradient id="policyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#E8722C" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#B8541C"/>
    </linearGradient>
    <linearGradient id="deployFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#E9A766"/>
      <stop offset="100%" stop-color="#E8722C"/>
    </linearGradient>
    <linearGradient id="funnelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#E9A766"/>
      <stop offset="100%" stop-color="#B8541C"/>
    </linearGradient>
    <radialGradient id="policyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#E8722C" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#E8722C" stop-opacity="0"/>
    </radialGradient>

    <!-- arrow markers -->
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8722C"/>
    </marker>
    <marker id="aGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E9A766"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7BC47F"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D8553A"/>
    </marker>
  </defs>

  <rect width="880" height="760" fill="url(#pageBg)"/>

  <!-- =====================================================================
       BAND 1 · Flow Matching Teacher Policy Training
       ===================================================================== -->
  <g transform="translate(20, 20)">
    <rect width="700" height="220" rx="14" fill="url(#bandGold)" stroke="#E9A766" stroke-opacity=".55"/>
    <text x="350" y="32" text-anchor="middle" fill="#E9A766"
          font-family="Cormorant Garamond, serif" font-size="20" font-weight="600">Flow Matching Teacher Policy Training</text>

    <!-- Offline Data Collection -->
    <g transform="translate(24, 60)">
      <rect width="160" height="130" rx="10" fill="url(#cardFill)" stroke="#2E2820"/>
      <text x="80" y="22" text-anchor="middle" fill="#F2E9D8"
            font-family="Inter, sans-serif" font-size="12" font-weight="600">Offline Data Collection</text>
      <!-- mini scatter / dataset glyph -->
      <g transform="translate(80, 70)" opacity=".95">
        <ellipse cx="0" cy="0" rx="40" ry="18" fill="none" stroke="#E8722C" stroke-opacity=".55" stroke-dasharray="3 4"/>
        <circle cx="-32" cy="-2" r="4"   fill="#E9A766"/>
        <circle cx="-14" cy="-8" r="3"   fill="#E9A766"/>
        <circle cx="6"   cy="2"  r="3"   fill="#E9A766"/>
        <circle cx="22"  cy="-4" r="3.5" fill="#E9A766"/>
        <circle cx="34"  cy="6"  r="3"   fill="#E9A766"/>
        <circle cx="-22" cy="10" r="3"   fill="#E9A766"/>
        <circle cx="14"  cy="12" r="3"   fill="#E9A766"/>
      </g>
      <text x="80" y="116" text-anchor="middle" fill="#7E7565"
            font-family="JetBrains Mono, monospace" font-size="10">𝒟 = {(x, a, r, ℓ, x′)}</text>
    </g>

    <!-- arrow: data → teacher -->
    <line x1="184" y1="125" x2="232" y2="125" stroke="#E8722C" stroke-width="2.4" marker-end="url(#aOrange)"/>

    <!-- Multi-Step Flow Matching Policy: small NN visual -->
    <g transform="translate(232, 60)">
      <rect width="280" height="130" rx="10" fill="url(#cardFill)" stroke="#2E2820"/>
      <text x="140" y="22" text-anchor="middle" fill="#F2E9D8"
            font-family="Inter, sans-serif" font-size="12" font-weight="600">Multi-Step Flow Matching Policy</text>

      <!-- a tiny neural-net schematic: edges first, then nodes -->
      <g transform="translate(0, 38)">
        <g stroke="#6FB7C9" stroke-opacity=".55" stroke-width="0.9" fill="none">
          <line x1="40"  y1="20" x2="100" y2="14"/><line x1="40"  y1="20" x2="100" y2="40"/><line x1="40"  y1="20" x2="100" y2="66"/>
          <line x1="40"  y1="46" x2="100" y2="14"/><line x1="40"  y1="46" x2="100" y2="40"/><line x1="40"  y1="46" x2="100" y2="66"/>
          <line x1="40"  y1="72" x2="100" y2="14"/><line x1="40"  y1="72" x2="100" y2="40"/><line x1="40"  y1="72" x2="100" y2="66"/>
          <line x1="180" y1="14" x2="240" y2="20"/><line x1="180" y1="14" x2="240" y2="46"/><line x1="180" y1="14" x2="240" y2="72"/>
          <line x1="180" y1="40" x2="240" y2="20"/><line x1="180" y1="40" x2="240" y2="46"/><line x1="180" y1="40" x2="240" y2="72"/>
          <line x1="180" y1="66" x2="240" y2="20"/><line x1="180" y1="66" x2="240" y2="46"/><line x1="180" y1="66" x2="240" y2="72"/>
        </g>
        <g fill="#1C1813" stroke="#E9A766">
          <circle cx="40"  cy="20" r="5"/><circle cx="40"  cy="46" r="5"/><circle cx="40"  cy="72" r="5"/>
          <circle cx="100" cy="14" r="5"/><circle cx="100" cy="40" r="5"/><circle cx="100" cy="66" r="5"/>
          <circle cx="180" cy="14" r="5"/><circle cx="180" cy="40" r="5"/><circle cx="180" cy="66" r="5"/>
          <circle cx="240" cy="20" r="5"/><circle cx="240" cy="46" r="5"/><circle cx="240" cy="72" r="5"/>
        </g>
      </g>
      <text x="140" y="92"  text-anchor="middle" fill="#7E7565" font-family="JetBrains Mono, monospace" font-size="13">. . .</text>
      <text x="140" y="118" text-anchor="middle" fill="#7E7565" font-family="JetBrains Mono, monospace" font-size="10">μ_θ : ODE  v_θ(t, x, z)</text>
    </g>

    <!-- arrow: teacher → distillation funnel -->
    <line x1="512" y1="125" x2="560" y2="125" stroke="#E8722C" stroke-width="2.4" marker-end="url(#aOrange)"/>

    <!-- Distillation funnel -->
    <g transform="translate(572, 78)">
      <text x="56" y="-6" text-anchor="middle" fill="#E9A766"
            font-family="Inter, sans-serif" font-size="11" font-weight="600">Policy Distillation</text>
      <path d="M8,8 L104,8 L70,58 L70,90 L42,90 L42,58 Z"
            fill="url(#funnelFill)" stroke="#7C3A12" stroke-width="1.4"/>
      <path d="M16,14 L96,14 L66,50 L66,86 L46,86 L46,50 Z"
            fill="none" stroke="#F2E9D8" stroke-opacity=".35"/>
    </g>
  </g>

  <!-- =====================================================================
       BAND 2 · Feasibility-Gated Actor Training
       ===================================================================== -->
  <g transform="translate(20, 260)">
    <rect width="700" height="240" rx="14" fill="url(#bandCool)" stroke="#6FB7C9" stroke-opacity=".55"/>
    <text x="350" y="32" text-anchor="middle" fill="#6FB7C9"
          font-family="Cormorant Garamond, serif" font-size="20" font-weight="600">Feasibility-Gated Actor Training</text>

    <!-- Two critic boxes, stacked -->
    <g transform="translate(24, 60)">
      <rect width="140" height="70" rx="10" fill="url(#cardFill)" stroke="#2E2820"/>
      <text x="14"  y="32" fill="#F2E9D8" font-family="Inter, sans-serif" font-size="12" font-weight="600">Reward</text>
      <text x="14"  y="50" fill="#F2E9D8" font-family="Inter, sans-serif" font-size="12" font-weight="600">Critic</text>
      <text x="100" y="44" text-anchor="middle" fill="#E9A766"
            font-family="Cormorant Garamond, serif" font-size="22" font-style="italic">Q_r</text>
    </g>
    <g transform="translate(24, 144)">
      <rect width="140" height="70" rx="10" fill="url(#cardFill)" stroke="#2E2820"/>
      <text x="14"  y="32" fill="#F2E9D8" font-family="Inter, sans-serif" font-size="12" font-weight="600">Safety</text>
      <text x="14"  y="50" fill="#F2E9D8" font-family="Inter, sans-serif" font-size="12" font-weight="600">Critic</text>
      <text x="100" y="44" text-anchor="middle" fill="#E9A766"
            font-family="Cormorant Garamond, serif" font-size="22" font-style="italic">Q_c</text>
    </g>

    <!-- arrows: critics → traffic light -->
    <line x1="164" y1="95"  x2="216" y2="120" stroke="#E8722C" stroke-width="2.2" marker-end="url(#aOrange)"/>
    <line x1="164" y1="179" x2="216" y2="160" stroke="#E8722C" stroke-width="2.2" marker-end="url(#aOrange)"/>

    <!-- Traffic-light gate (ζ) -->
    <g transform="translate(220, 92)">
      <rect width="48" height="100" rx="10" fill="#0c0a07" stroke="#2E2820"/>
      <circle cx="24" cy="20" r="9" fill="#D8553A"/>
      <circle cx="24" cy="50" r="9" fill="#E9A766"/>
      <circle cx="24" cy="80" r="9" fill="#7BC47F"/>
    </g>

    <!-- Q_c < 0 → REWARD MAXIMIZATION -->
    <path d="M268,116 C 300,108 320,90 348,90" fill="none" stroke="#7BC47F" stroke-width="2.2" marker-end="url(#aGreen)"/>
    <text x="278" y="98" fill="#7BC47F" font-family="JetBrains Mono, monospace" font-size="10">Q_c &lt; 0</text>

    <g transform="translate(348, 60)">
      <rect width="160" height="64" rx="10" fill="url(#cardFill)" stroke="#7BC47F" stroke-opacity=".55"/>
      <!-- rocket-ish glyph -->
      <g transform="translate(20, 18)">
        <path d="M0,18 L14,0 L28,18 L20,18 L20,28 L8,28 L8,18 Z" fill="#7BC47F" fill-opacity=".85"/>
        <circle cx="14" cy="10" r="3" fill="#15130F"/>
        <path d="M10,30 L14,40 L18,30 Z" fill="#E8722C"/>
      </g>
      <text x="100" y="32" text-anchor="middle" fill="#F2E9D8"
            font-family="Inter, sans-serif" font-size="11" font-weight="700">REWARD</text>
      <text x="100" y="48" text-anchor="middle" fill="#F2E9D8"
            font-family="Inter, sans-serif" font-size="11" font-weight="700">MAXIMIZATION</text>
    </g>

    <!-- Q_c >= 0 → FEASIBILITY RECOVERY -->
    <path d="M268,168 C 300,176 320,194 348,194" fill="none" stroke="#D8553A" stroke-width="2.2" marker-end="url(#aRed)"/>
    <text x="278" y="200" fill="#D8553A" font-family="JetBrains Mono, monospace" font-size="10">Q_c ≥ 0</text>

    <g transform="translate(348, 162)">
      <rect width="160" height="64" rx="10" fill="url(#cardFill)" stroke="#D8553A" stroke-opacity=".55"/>
      <!-- life-preserver glyph -->
      <g transform="translate(36, 32)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#D8553A" stroke-width="4"/>
        <circle cx="0" cy="0" r="6"  fill="none" stroke="#D8553A" stroke-width="2.5"/>
        <line x1="-14" y1="0" x2="14" y2="0" stroke="#F2E9D8" stroke-width="2"/>
        <line x1="0" y1="-14" x2="0" y2="14" stroke="#F2E9D8" stroke-width="2"/>
      </g>
      <text x="100" y="32" text-anchor="middle" fill="#F2E9D8"
            font-family="Inter, sans-serif" font-size="11" font-weight="700">FEASIBILITY</text>
      <text x="100" y="48" text-anchor="middle" fill="#F2E9D8"
            font-family="Inter, sans-serif" font-size="11" font-weight="700">RECOVERY</text>
    </g>

    <!-- merge arrows: REWARD MAX / FEASIBILITY RECOVERY → policy tile.
         Routed to the right edge of the band so they don't cross any box. -->
    <path d="M508,92  C 560,92  610,118 700,128" fill="none" stroke="#E8722C" stroke-width="2.2" marker-end="url(#aOrange)"/>
    <path d="M508,194 C 560,194 610,170 700,160" fill="none" stroke="#E8722C" stroke-width="2.2" marker-end="url(#aOrange)"/>
  </g>

  <!-- =====================================================================
       Central highlighted box: Safe & Optimal One-Step Policy
       Spans bands 1-2 vertically on the right.
       ===================================================================== -->
  <g transform="translate(740, 168)">
    <ellipse cx="60" cy="100" rx="80" ry="120" fill="url(#policyGlow)"/>
    <rect width="120" height="200" rx="14" fill="url(#policyFill)" stroke="#7C3A12" stroke-width="1.5"/>
    <text x="60" y="90"  text-anchor="middle" fill="#15130F"
          font-family="Inter, sans-serif" font-size="12" font-weight="700">Safe &amp; Optimal</text>
    <text x="60" y="108" text-anchor="middle" fill="#15130F"
          font-family="Inter, sans-serif" font-size="12" font-weight="700">One-Step Policy</text>
    <text x="60" y="142" text-anchor="middle" fill="#15130F"
          font-family="Cormorant Garamond, serif" font-size="22" font-style="italic" font-weight="600">μ_ω(x, z)</text>
  </g>

  <!-- arrow from Distillation funnel → Policy box (clean S-curve, no label overlap) -->
  <path d="M662,172 C 700,172 720,200 740,210" fill="none" stroke="#E9A766" stroke-width="2.4" marker-end="url(#aGold)"/>

  <!-- =====================================================================
       BAND 3 · Conformal Prediction
       ===================================================================== -->
  <g transform="translate(20, 520)">
    <rect width="840" height="220" rx="14" fill="url(#bandCopper)" stroke="#E8722C" stroke-opacity=".55"/>
    <text x="420" y="32" text-anchor="middle" fill="#E8722C"
          font-family="Cormorant Garamond, serif" font-size="20" font-weight="600">Conformal Prediction</text>

    <!-- Held-out Calibration Data -->
    <g transform="translate(24, 70)">
      <rect width="160" height="120" rx="10" fill="url(#cardFill)" stroke="#2E2820"/>
      <text x="80" y="26" text-anchor="middle" fill="#F2E9D8"
            font-family="Inter, sans-serif" font-size="12" font-weight="600">Held-out</text>
      <text x="80" y="42" text-anchor="middle" fill="#F2E9D8"
            font-family="Inter, sans-serif" font-size="12" font-weight="600">Calibration Data</text>
      <g transform="translate(80, 80)">
        <rect x="-44" y="-14" width="88" height="28" rx="4" fill="#0c0a07" stroke="#2E2820"/>
        <g fill="#6FB7C9">
          <circle cx="-30" cy="0" r="3"/>
          <circle cx="-15" cy="0" r="3"/>
          <circle cx="0"   cy="0" r="3"/>
          <circle cx="15"  cy="0" r="3"/>
          <circle cx="30"  cy="0" r="3"/>
        </g>
      </g>
      <text x="80" y="110" text-anchor="middle" fill="#7E7565"
            font-family="JetBrains Mono, monospace" font-size="10">N_cal samples</text>
    </g>

    <!-- arrow → calibration -->
    <line x1="184" y1="130" x2="232" y2="130" stroke="#E8722C" stroke-width="2.4" marker-end="url(#aOrange)"/>

    <!-- Conformal Calibration: sliders + density curve with δ* -->
    <g transform="translate(232, 70)">
      <rect width="220" height="120" rx="10" fill="url(#cardFill)" stroke="#2E2820"/>
      <text x="110" y="22" text-anchor="middle" fill="#F2E9D8"
            font-family="Inter, sans-serif" font-size="12" font-weight="600">Conformal Calibration</text>

      <!-- sliders on the left -->
      <g transform="translate(20, 44)" stroke="#7E7565" stroke-width="2">
        <line x1="0" y1="8"  x2="60" y2="8"/>
        <circle cx="42" cy="8" r="5" fill="#E8722C" stroke="none"/>
        <line x1="0" y1="28" x2="60" y2="28"/>
        <circle cx="20" cy="28" r="5" fill="#E9A766" stroke="none"/>
        <line x1="0" y1="48" x2="60" y2="48"/>
        <circle cx="32" cy="48" r="5" fill="#6FB7C9" stroke="none"/>
      </g>
      <text x="50" y="116" text-anchor="middle" fill="#7E7565"
            font-family="JetBrains Mono, monospace" font-size="9.5">ε_s , β_s</text>

      <!-- distribution + δ* threshold on the right -->
      <g transform="translate(110, 50)">
        <line x1="0" y1="46" x2="100" y2="46" stroke="#2E2820"/>
        <path d="M0,40 C 20,38 30,30 40,18 C 50,6 60,18 70,30 C 80,40 90,44 100,46"
              fill="none" stroke="#E9A766" stroke-width="2"/>
        <line x1="62" y1="14" x2="62" y2="46" stroke="#E8722C" stroke-width="2" stroke-dasharray="3 3"/>
        <text x="62" y="10" text-anchor="middle" fill="#E8722C"
              font-family="Cormorant Garamond, serif" font-size="14" font-style="italic">δ*</text>
      </g>
    </g>

    <!-- arrow → guarantee -->
    <line x1="452" y1="130" x2="500" y2="130" stroke="#E8722C" stroke-width="2.4" marker-end="url(#aOrange)"/>

    <!-- Statistical Safety Guarantee -->
    <g transform="translate(500, 86)">
      <rect width="180" height="88" rx="10" fill="url(#cardFill)" stroke="#2E2820"/>
      <text x="90" y="28" text-anchor="middle" fill="#F2E9D8"
            font-family="Inter, sans-serif" font-size="12" font-weight="600">Statistical Safety</text>
      <text x="90" y="46" text-anchor="middle" fill="#F2E9D8"
            font-family="Inter, sans-serif" font-size="12" font-weight="600">Guarantee</text>
      <text x="90" y="70" text-anchor="middle" fill="#7E7565"
            font-family="JetBrains Mono, monospace" font-size="10">P(safe) ≥ 1 − ε_s</text>
    </g>

    <!-- arrow → DEPLOY pill -->
    <line x1="680" y1="130" x2="720" y2="130" stroke="#E8722C" stroke-width="2.6" marker-end="url(#aOrange)"/>
    <g transform="translate(722, 110)">
      <rect width="106" height="40" rx="20" fill="url(#deployFill)" stroke="#7C3A12" stroke-width="1.4"/>
      <text x="53" y="26" text-anchor="middle" fill="#15130F"
            font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="2">DEPLOY</text>
    </g>
  </g>

  <!-- Feedback arrow: One-Step Policy → Conformal Calibration.
       Routed via the right margin then sweeping leftward into the
       calibration block, well outside every other component. -->
  <path d="M860,372 C 870,420 870,510 700,560 Q 540,580 360,600"
        fill="none" stroke="#E8722C" stroke-width="2.2"
        stroke-dasharray="6 4" marker-end="url(#aOrange)"/>
  <text x="855" y="492" text-anchor="end" fill="#7E7565"
        font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1">verify policy on held-out states</text>
</svg>
