<?xml version="1.0" encoding="UTF-8"?>
<!-- SafeFQL — safety rate vs N (action samples per step).
     Replicates Figure 3 of the paper: SafeFQL is flat at ~100% from N=1,
     while FISOR / SafeIFQL only catch up after N≈16 candidates. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img"
     aria-label="Safety rate as a function of action sample budget N: SafeFQL stays at 100% from N=1; FISOR and SafeIFQL only approach 100% as N grows.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#15130F"/>
      <stop offset="100%" stop-color="#0E0D0B"/>
    </linearGradient>
    <linearGradient id="ourLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#E8722C"/>
      <stop offset="100%" stop-color="#E9A766"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <text x="40" y="28" fill="#7E7565" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2">SAFETY RATE vs ACTION SAMPLES  N</text>

  <g transform="translate(72, 56)">
    <!-- axes -->
    <line x1="0" y1="204" x2="520" y2="204" stroke="#2E2820"/>
    <line x1="0" y1="0"   x2="0"   y2="204" stroke="#2E2820"/>

    <!-- gridlines + y-axis labels -->
    <g stroke="#1C1813" stroke-dasharray="2 4">
      <line x1="0" y1="0"   x2="520" y2="0"/>
      <line x1="0" y1="51"  x2="520" y2="51"/>
      <line x1="0" y1="102" x2="520" y2="102"/>
      <line x1="0" y1="153" x2="520" y2="153"/>
    </g>
    <g fill="#7E7565" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">
      <text x="-8" y="208">0%</text>
      <text x="-8" y="157">25%</text>
      <text x="-8" y="106">50%</text>
      <text x="-8" y="55">75%</text>
      <text x="-8" y="4">100%</text>
    </g>

    <!-- x ticks: N = 1, 4, 8, 16 → x positions 40, 200, 360, 480 -->
    <g fill="#7E7565" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">
      <text x="40"  y="222">1</text>
      <text x="200" y="222">4</text>
      <text x="360" y="222">8</text>
      <text x="480" y="222">16</text>
      <text x="260" y="246" fill="#B7AC97" font-family="Inter, sans-serif" font-size="11">N (action samples per step)</text>
    </g>
    <text x="-50" y="-10" fill="#B7AC97" font-family="Inter, sans-serif" font-size="11">safety rate</text>

    <!-- SafeFQL — flat at ~100% (y ≈ 4) -->
    <path d="M40,5 L200,5 L360,5 L480,5" fill="none" stroke="url(#ourLine)" stroke-width="3.4" stroke-linecap="round"/>
    <g fill="#E8722C">
      <circle cx="40"  cy="5" r="6"/>
      <circle cx="200" cy="5" r="6"/>
      <circle cx="360" cy="5" r="6"/>
      <circle cx="480" cy="5" r="6"/>
    </g>
    <text x="494" y="9" fill="#E8722C" font-family="Inter, sans-serif" font-size="11" font-weight="600">SafeFQL</text>

    <!-- SafeIFQL — rises from ~50% to ~95% -->
    <path d="M40,108 Q 120,55 200,40 T 360,15 T 480,8" fill="none" stroke="#6FB7C9" stroke-width="2.2" stroke-linecap="round"/>
    <g fill="#6FB7C9">
      <circle cx="40"  cy="108" r="4.5"/>
      <circle cx="200" cy="40"  r="4.5"/>
      <circle cx="360" cy="15"  r="4.5"/>
      <circle cx="480" cy="8"   r="4.5"/>
    </g>
    <text x="494" y="22" fill="#6FB7C9" font-family="Inter, sans-serif" font-size="11">SafeIFQL</text>

    <!-- FISOR — rises from ~30% to ~90% -->
    <path d="M40,140 Q 120,90 200,68 T 360,32 T 480,18" fill="none" stroke="#B7AC97" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 4"/>
    <g fill="#B7AC97">
      <circle cx="40"  cy="140" r="4.5"/>
      <circle cx="200" cy="68"  r="4.5"/>
      <circle cx="360" cy="32"  r="4.5"/>
      <circle cx="480" cy="18"  r="4.5"/>
    </g>
    <text x="494" y="32" fill="#B7AC97" font-family="Inter, sans-serif" font-size="11">FISOR</text>

    <!-- Annotation: rejection sampling needed (placed mid-chart, well above the x-axis label) -->
    <g>
      <rect x="100" y="100" width="260" height="34" rx="6" fill="#1C1813" stroke="#2E2820"/>
      <text x="230" y="115" text-anchor="middle" fill="#B7AC97" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="1">REJECTION SAMPLING  (N candidates →</text>
      <text x="230" y="128" text-anchor="middle" fill="#B7AC97" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="1">filter by Q_c, Q_r) needed to catch up</text>
    </g>
  </g>
</svg>
